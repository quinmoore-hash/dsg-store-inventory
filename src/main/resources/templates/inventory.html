<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>DSG Store Ops - Inventory</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        .navbar { background: #1b5e20; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .navbar h1 { color: #fff; font-size: 1.25rem; }
        .navbar a { color: #c8e6c9; text-decoration: none; font-size: 0.9rem; }
        .navbar a:hover { color: #fff; }
        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
        h2 { color: #1b5e20; margin-bottom: 1rem; }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 6px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        th { background: #2e7d32; color: #fff; text-align: left; padding: 0.75rem 1rem; font-size: 0.85rem; text-transform: uppercase; }
        td { padding: 0.6rem 1rem; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        tr:hover { background: #e8f5e9; }
        .stock-low { color: #c62828; font-weight: bold; }
    </style>
</head>
<body>
<div class="navbar">
    <h1>DSG Store Ops</h1>
    <a th:href="@{/logout}">Logout</a>
</div>
<div class="container">
    <h2>Product Inventory</h2>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Product Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}">
            <td th:text="${product.id}"></td>
            <td th:text="${product.name}"></td>
            <td th:text="${product.category}"></td>
            <td th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 2)}"></td>
            <td th:classappend="${product.stock lt 10} ? 'stock-low'" th:text="${product.stock}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
