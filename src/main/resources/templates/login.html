<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>DSG Store Ops - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1b5e20; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { background: #fff; padding: 2.5rem; border-radius: 8px; width: 360px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .login-card h1 { color: #1b5e20; text-align: center; margin-bottom: 0.25rem; font-size: 1.5rem; }
        .login-card p { color: #666; text-align: center; margin-bottom: 1.5rem; font-size: 0.85rem; }
        .login-card label { display: block; margin-bottom: 0.25rem; font-weight: bold; color: #333; font-size: 0.9rem; }
        .login-card input[type="text"], .login-card input[type="password"] { width: 100%; padding: 0.6rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        .login-card button { width: 100%; padding: 0.75rem; background: #1b5e20; color: #fff; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; font-weight: bold; }
        .login-card button:hover { background: #2e7d32; }
        .error { color: #c62828; text-align: center; margin-bottom: 1rem; font-size: 0.85rem; }
    </style>
</head>
<body>
<div class="login-card">
    <h1>DSG Store Ops</h1>
    <p>Internal Inventory Management</p>
    <div th:if="${param.error}" class="error">Invalid username or password.</div>
    <form th:action="@{/login}" method="post">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autofocus="autofocus"/>
        <label for="password">Password</label>
        <input type="password" id="password" name="password"/>
        <button type="submit">Sign In</button>
    </form>
</div>
</body>
</html>
